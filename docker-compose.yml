services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8011:8011"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - SAM_MODEL=facebook/sam-audio-small
      - NVIDIA_VISIBLE_DEVICES=all
    # NVIDIA recommended settings for PyTorch
    ipc: host
    shm_size: '8gb'
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - sam_audio_tmp:/tmp/sam-audio
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  huggingface_cache:
  sam_audio_tmp:
